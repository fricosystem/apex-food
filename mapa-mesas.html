<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: {
          bg: '#000000',
          panel: '#080808',
          card: '#0a0a0a',
          card2: '#0d0d0d',
          border: '#161616',
          border2: '#1a1a1a',
          muted: '#8a8a8a',
          accent: '#ea580c',
          accentHover: '#f97316',
          green: '#22c55e',
          red: '#ef4444',
          yellow: '#eab308',
          purple: '#a78bfa',
          purpleLight: '#c4b5fd',
          purpleDark: '#7c3aed',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background: #000000; color: #e5e5e5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #262626; }
  .bar { transition: height 0.6s ease; }
  .btn-press:active { transform: scale(0.97); }
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .glow-orange { box-shadow: 0 0 30px rgba(234, 88, 12, 0.5), 0 0 60px rgba(234, 88, 12, 0.2); }
  .card-gradient { background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 50%, #080808 100%); }

  .dot-pulse { animation: dotPulse 2s ease-in-out infinite; }
  @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* Tree-style sidebar */
  .tree-group { position: relative; padding-left: 0; }
  .tree-item { position: relative; padding-left: 2.25rem; }
  .tree-item::before {
    content: '';
    position: absolute;
    left: 0.75rem;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #1a1a1a;
  }
  .tree-item:last-child::before { bottom: 50%; }
  .tree-item::after {
    content: '';
    position: absolute;
    left: 0.75rem;
    top: 50%;
    width: 0.75rem;
    height: 1px;
    background: #1a1a1a;
  }
  .tree-item.active::before { background: rgba(234, 88, 12, 0.4); }
  .tree-item.active::after { background: rgba(234, 88, 12, 0.4); }
  .tree-item.active .tree-link { background: rgba(234, 88, 12, 0.15); color: #ea580c; }
  .tree-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    color: #8a8a8a;
    font-size: 0.875rem;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .tree-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .tree-link.active { color: #ea580c; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.5rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    user-select: none;
  }
  .section-header .section-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #8a8a8a;
    display: flex;
    align-items: center;
    gap: 0.375rem;
  }
  .section-header .section-title .section-icon { color: #a3a3a3; }

  .sidebar-drawer { transform: translateX(-100%); transition: transform 0.3s ease; }
  .sidebar-drawer.open { transform: translateX(0); }
  .sidebar-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

  @media (max-width: 1024px) {
    .sidebar-desktop { display: none !important; }
    .sidebar-mobile { display: flex !important; }
  }
  @media (min-width: 1025px) {
    .sidebar-mobile { display: none !important; }
    .sidebar-overlay { display: none !important; }
  }

  .sidebar-scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .sidebar-scroll::-webkit-scrollbar { width: 4px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }
</style>
</head>
<body class="min-h-screen">

<script>
  const sidebarSections = [
    { title: 'GERAL', icon: 'layout-dashboard', items: [{ label: 'Home Page', icon: 'home', href: 'index.html', desc: 'Dashboard principal do restaurante' }] },
    { title: 'DASHBOARDS', icon: 'bar-chart-3', items: [{ label: 'Operacional', icon: 'activity', desc: 'Pedidos ativos, fila da cozinha, ocupação' }, { label: 'Financeiro', icon: 'dollar-sign', desc: 'Faturamento, ticket médio, metas' }, { label: 'Desempenho', icon: 'trending-up', desc: 'Tempo de preparo, avaliações' }] },

    { title: 'CARDÁPIO', icon: 'book-open', items: [{ label: 'Categorias', icon: 'folder', desc: 'Entradas, principais, bebidas, etc.' }, { label: 'Produtos', icon: 'package', desc: 'Cadastro de itens com preço e foto' }, { label: 'Promoções', icon: 'tag', desc: 'Ofertas do dia, combos, descontos' }, { label: 'Cardápio Digital', icon: 'qr-code', desc: 'Preview do QR Code do cliente' }] },
    { title: 'SALÃO', icon: 'armchair', items: [{ label: 'Mapa de Mesas', icon: 'layout-grid', href: 'mapa-mesas.html', active: true, desc: 'Status de cada mesa' }, { label: 'Reservas', icon: 'calendar', desc: 'Controle de reservas antecipadas' }, { label: 'Configuração de Mesas', icon: 'settings', desc: 'Adicionar/remover mesas e QR' }] },
    { title: 'EQUIPE', icon: 'users', items: [{ label: 'Funcionários', icon: 'user-circle', desc: 'Garçons, cozinheiros, gerentes' }, { label: 'Escala de Trabalho', icon: 'calendar-clock', desc: 'Turnos e horários' }, { label: 'Comissões', icon: 'percent', desc: 'Comissões por garçom' }] },
    { title: 'FINANCEIRO', icon: 'wallet', items: [{ label: 'Fechamento de Caixa', icon: 'lock', desc: 'Encerrar expediente com relatório' }, { label: 'Fluxo de Caixa', icon: 'arrow-left-right', desc: 'Entradas e saídas do dia' }, { label: 'Contas a Pagar/Receber', icon: 'file-text', desc: 'Fornecedores e contas fixas' }, { label: 'Relatórios Financeiros', icon: 'pie-chart', desc: 'Extrato diário, semanal, mensal' }] },
    { title: 'RELATÓRIOS', icon: 'file-bar-chart', items: [{ label: 'Vendas por Período', icon: 'bar-chart-3', desc: 'Análise de vendas' }, { label: 'Produtos Mais Vendidos', icon: 'star', desc: 'Top produtos' }, { label: 'Horários de Pico', icon: 'clock', desc: 'Melhores horários' }, { label: 'Avaliações dos Clientes', icon: 'message-square', desc: 'Feedback dos clientes' }, { label: 'Performance da Equipe', icon: 'award', desc: 'Desempenho dos funcionários' }] }
  ];

  function buildSidebar(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    sidebarSections.forEach((section, sIdx) => {
      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'p-4' + (sIdx > 0 ? ' border-t border-border' : '');
      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `<div class="section-title"><i data-lucide="${section.icon}" class="section-icon w-3.5 h-3.5"></i><span>${section.title}</span></div><i data-lucide="chevron-down" class="w-3 h-3 text-muted"></i>`;
      sectionDiv.appendChild(header);
      const nav = document.createElement('nav');
      nav.className = 'tree-group space-y-1';
      section.items.forEach((item) => {
        const treeItem = document.createElement('div');
        treeItem.className = 'tree-item' + (item.active ? ' active' : '');
        const link = document.createElement('a');
        link.href = item.href || '#';
        link.className = 'tree-link' + (item.active ? ' active' : '');
        link.title = item.desc;
        link.innerHTML = `<i data-lucide="${item.icon}" class="w-4 h-4 flex-shrink-0"></i><span>${item.label}</span>`;
        link.addEventListener('click', (e) => {
          document.querySelectorAll('.tree-link').forEach(l => l.classList.remove('active'));
          document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
          link.classList.add('active');
          treeItem.classList.add('active');
          closeMenu();
          if (item.href) return;
          e.preventDefault();
        });
        treeItem.appendChild(link);
        nav.appendChild(treeItem);
      });
      sectionDiv.appendChild(nav);
      container.appendChild(sectionDiv);
    });
    lucide.createIcons();
  }

  buildSidebar('sidebarContentDesktop');
  buildSidebar('sidebarContentMobile');

  const menuBtn = document.getElementById('menuBtn');
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const sidebarMobile = document.getElementById('sidebarMobile');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  function openMenu() { sidebarMobile.classList.add('open'); sidebarOverlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeMenu() { sidebarMobile.classList.remove('open'); sidebarOverlay.classList.remove('open'); document.body.style.overflow = ''; }

  if (menuBtn) menuBtn.addEventListener('click', openMenu);
  if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
  if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeMenu);

  const statusConfig = {
    ocupada: { label: 'Ocupada', dot: 'bg-accent', text: 'text-accent', badge: 'bg-accent/10 text-accent border-accent/30', avatar: 'bg-accent/15 text-accent' },
    disponivel: { label: 'Disponível', dot: 'bg-green', text: 'text-green', badge: 'bg-green/10 text-green border-green/30', avatar: 'bg-green/15 text-green' },
    indisponivel: { label: 'Indisponível', dot: 'bg-red', text: 'text-red', badge: 'bg-red/10 text-red border-red/30', avatar: 'bg-red/15 text-red' }
  };

  const tables = [
    { id: 1, nome: 'Mesa 01', capacidade: 4, status: 'ocupada', reserva: 'Carlos Silva', comanda: '#CMD-4521', valorGasto: 156.80, garcom: 'João', inicio: '13:45', reservaHora: '12:30', itens: ['Pizza Margherita', 'Coca-Cola 1L', 'Água Mineral'] },
    { id: 2, nome: 'Mesa 02', capacidade: 4, status: 'disponivel' },
    { id: 3, nome: 'Mesa 03', capacidade: 6, status: 'ocupada', reserva: 'Ana Costa', comanda: '#CMD-4523', valorGasto: 234.70, garcom: 'Maria', inicio: '14:20', reservaHora: '14:00', itens: ['Filé Mignon', 'Salada Caesar', 'Suco de Laranja'] },
    { id: 4, nome: 'Mesa 04', capacidade: 2, status: 'disponivel' },
    { id: 5, nome: 'Mesa 05', capacidade: 4, status: 'indisponivel', motivo: 'Em manutenção' },
    { id: 6, nome: 'Mesa 06', capacidade: 2, status: 'ocupada', reserva: 'Roberto Lima', comanda: '#CMD-4525', valorGasto: 89.50, garcom: 'Pedro', inicio: '12:10', reservaHora: '11:00', itens: ['Hambúrguer Artesanal', 'Batata Frita'] },
    { id: 7, nome: 'Mesa 07', capacidade: 8, status: 'ocupada', reserva: 'Fernanda Souza', comanda: '#CMD-4528', valorGasto: 312.00, garcom: 'João', inicio: '13:00', reservaHora: '12:00', itens: ['Risoto de Camarão', 'Parmegiana', 'Vinho Tinto', 'Tiramisù'] },
    { id: 8, nome: 'Mesa 08', capacidade: 6, status: 'disponivel' },
    { id: 9, nome: 'Mesa 09', capacidade: 4, status: 'ocupada', reserva: 'Marcos Oliveira', comanda: '#CMD-4530', valorGasto: 198.20, garcom: 'Maria', inicio: '14:40', reservaHora: '14:00', itens: ['Moqueca', 'Arroz', 'Farofa'] },
    { id: 10, nome: 'Mesa 10', capacidade: 2, status: 'disponivel' },
    { id: 11, nome: 'Mesa 11', capacidade: 4, status: 'indisponivel', motivo: 'Bloqueada' },
    { id: 12, nome: 'Mesa 12', capacidade: 2, status: 'ocupada', reserva: 'Juliana Alves', comanda: '#CMD-4532', valorGasto: 67.30, garcom: 'Pedro', inicio: '15:10', itens: ['Porção de Fritas', 'Chopp'] },
    { id: 13, nome: 'Mesa 13', capacidade: 4, status: 'disponivel' },
    { id: 14, nome: 'Mesa 14', capacidade: 6, status: 'ocupada', reserva: 'Paulo Mendes', comanda: '#CMD-4535', valorGasto: 275.40, garcom: 'João', inicio: '15:30', reservaHora: '15:00', itens: ['Churrasco Misto', 'Picanha', 'Maionese'] },
    { id: 15, nome: 'Mesa 15', capacidade: 4, status: 'disponivel' },
    { id: 16, nome: 'Mesa 16', capacidade: 4, status: 'ocupada', reserva: 'Camila Rocha', comanda: '#CMD-4537', valorGasto: 125.90, garcom: 'Maria', inicio: '16:00', itens: ['Macarrão à Bolonhesa', 'Coca-Cola 2L'] },
    { id: 17, nome: 'Mesa 17', capacidade: 8, status: 'disponivel' },
    { id: 18, nome: 'Mesa 18', capacidade: 4, status: 'indisponivel', motivo: 'Reservada p/ evento' }
  ];

  function formatCurrency(value) {
    return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function renderGrid() {
    const grid = document.getElementById('tablesGrid');
    grid.innerHTML = '';
    const counts = { ocupada: 0, disponivel: 0, indisponivel: 0 };

    tables.forEach(t => {
      counts[t.status]++;
      const st = statusConfig[t.status];
      const info = t.status === 'ocupada' ? `Desde ${t.inicio}` : (t.status === 'disponivel' ? 'Livre agora' : (t.motivo || ''));

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'table-btn btn-press relative rounded-xl bg-card border border-border p-3 sm:p-4 text-left transition hover:border-accent/50 hover:-translate-y-0.5';
      btn.innerHTML = `
        <div class="flex items-start justify-between mb-2">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full ${st.dot} dot-pulse"></span>
            <span class="text-[9px] sm:text-[10px] font-medium ${st.text}">${st.label}</span>
          </div>
          <i data-lucide="users" class="w-3.5 h-3.5 text-muted"></i>
        </div>
        <div class="text-sm sm:text-base font-bold">${t.nome}</div>
        <div class="text-[10px] sm:text-xs text-muted mt-0.5">${t.capacidade} lugares</div>
        <div class="text-[10px] sm:text-xs ${t.status === 'ocupada' ? 'text-accent/80' : 'text-muted'} mt-2">${info}</div>
      `;
      btn.addEventListener('click', () => openModal(t.id));
      grid.appendChild(btn);
    });

    document.getElementById('statOcupadas').textContent = counts.ocupada;
    document.getElementById('statDisponiveis').textContent = counts.disponivel;
    document.getElementById('statIndisponiveis').textContent = counts.indisponivel;
    lucide.createIcons();
  }

  function openModal(id) {
    const t = tables.find(x => x.id === id);
    if (!t) return;
    const st = statusConfig[t.status];

    document.getElementById('modalTitle').textContent = t.nome;

    const statusEl = document.getElementById('modalStatus');
    statusEl.className = `inline-flex items-center gap-1.5 mt-1 px-2.5 py-0.5 rounded-md text-xs font-medium border ${st.badge}`;
    statusEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${st.dot}"></span>${st.label}`;

    const avatar = document.getElementById('modalAvatar');
    avatar.className = `w-11 h-11 rounded-xl flex items-center justify-center ${st.avatar}`;
    avatar.innerHTML = `<i data-lucide="armchair" class="w-5 h-5"></i>`;

    document.getElementById('modalReserva').textContent = t.reserva || '—';
    document.getElementById('modalComanda').textContent = t.comanda || '—';
    document.getElementById('modalValor').textContent = t.valorGasto ? formatCurrency(t.valorGasto) : '—';
    document.getElementById('modalCapacidade').textContent = `${t.capacidade} lugares`;
    document.getElementById('modalGarcom').textContent = t.garcom || '—';
    document.getElementById('modalInicio').textContent = t.inicio || '—';

    const itemsSection = document.getElementById('modalItemsSection');
    const itemsBox = document.getElementById('modalItems');
    const itemCount = document.getElementById('modalItemCount');
    if (t.itens && t.itens.length) {
      itemsSection.classList.remove('hidden');
      itemCount.textContent = `${t.itens.length} itens`;
      itemsBox.innerHTML = t.itens.map(item => `
        <div class="flex items-center justify-between px-3 py-2">
          <div class="flex items-center gap-2">
            <i data-lucide="utensils-crossed" class="w-3.5 h-3.5 text-muted"></i>
            <span class="text-xs sm:text-sm">${item}</span>
          </div>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-muted"></i>
        </div>
      `).join('');
    } else {
      itemsSection.classList.add('hidden');
    }

    document.getElementById('modalComandaBtn').classList.toggle('hidden', t.status !== 'ocupada');

    const modal = document.getElementById('tableModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    lucide.createIcons();
  }

  function closeModal() {
    const modal = document.getElementById('tableModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  renderGrid();
</script>
</body>
</html>
