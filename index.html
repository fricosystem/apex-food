<style>
  body { font-family: 'Inter', sans-serif; background: #000000; color: #e5e5e5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #262626; }
  .bar { transition: height 0.6s ease; }
  .btn-press:active { transform: scale(0.97); }
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .glow-orange { box-shadow: 0 0 30px rgba(234, 88, 12, 0.5), 0 0 60px rgba(234, 88, 12, 0.2); }
  .card-gradient { background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 50%, #080808 100%); }

  /* Tree-style sidebar */
  .tree-group { position: relative; padding-left: 0; }
  .tree-item { position: relative; padding-left: 2.25rem; }
  .tree-item::before {
    content: '';
    position: absolute;
    left: 0.75rem;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #1a1a1a;
  }
  .tree-item:last-child::before { bottom: 50%; }
  .tree-item::after {
    content: '';
    position: absolute;
    left: 0.75rem;
    top: 50%;
    width: 0.75rem;
    height: 1px;
    background: #1a1a1a;
  }
  .tree-item.active::before { background: rgba(234, 88, 12, 0.4); }
  .tree-item.active::after { background: rgba(234, 88, 12, 0.4); }
  .tree-item.active .tree-link { background: rgba(234, 88, 12, 0.15); color: #ea580c; }
  .tree-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    color: #8a8a8a;
    font-size: 0.875rem;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .tree-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .tree-link.active { color: #ea580c; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.5rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    user-select: none;
  }
  .section-header .section-title {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #8a8a8a;
    display: flex;
    align-items: center;
    gap: 0.375rem;
  }
  .section-header .section-title .section-icon { color: #a3a3a3; }

  .sidebar-drawer { transform: translateX(-100%); visibility: hidden; transition: transform 0.22s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 0.22s; will-change: transform; }
  .sidebar-drawer.open { transform: translateX(0); visibility: visible; transition-delay: 0s; }
  .sidebar-overlay { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.22s ease, visibility 0s linear 0.22s; }
  .sidebar-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
  body.menu-mobile-aberto { overflow: hidden; }
  .sidebar-scroll { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

  @media (max-width: 1024px) {
    .sidebar-desktop { display: none !important; }
    .sidebar-mobile { display: flex !important; }
  }
  @media (min-width: 1025px) {
    .sidebar-mobile { display: none !important; }
    .sidebar-overlay { display: none !important; }
  }

  .sidebar-scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .sidebar-scroll::-webkit-scrollbar { width: 4px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }
  .perfil-sidebar-menu { opacity: 0; transform: translateY(0.35rem) scale(0.98); pointer-events: none; visibility: hidden; transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0.18s; }
  .perfil-sidebar-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; visibility: visible; transition-delay: 0s; }

  .status-dot {
    animation: statusPulse 2s ease-in-out infinite;
  }
  @keyframes statusPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
  }
  .progress-bar {
    animation: progressFill 1.5s ease-out forwards;
    transform-origin: left;
  }
  @keyframes progressFill {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }
  .metric-value {
    animation: countUp 1s ease-out forwards;
  }
  @keyframes countUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<i class="w-5 h-5" data-lucide="menu"></i>
</button>

<!-- Mobile Sidebar Overlay -->

<!-- Mobile Sidebar Drawer -->
<aside aria-hidden="true" class="sidebar-mobile sidebar-drawer fixed top-0 left-0 h-full w-[min(86vw,20rem)] bg-panel border-r border-border z-50 flex flex-col" id="sidebarMobile">

</div>
<button aria-label="Fechar menu" class="p-1.5 rounded-md hover:bg-card2 text-muted transition" id="closeMenuBtn">

<!-- Desktop Sidebar -->

<!-- Main Content -->
<main class="flex-1 lg:ml-64 min-h-screen">
<header class="hidden lg:flex sticky top-0 z-20 bg-bg/80 backdrop-blur-xl border-b border-border px-6 py-4 items-center justify-between">

<i class="w-4 h-4" data-lucide="help-circle"></i>
</button>

<script>
const sidebarSections = [
    { title: 'GERAL', icon: 'layout-dashboard', items: [{ label: 'Visão Geral', icon: 'home', href: '/', active: true, desc: 'Dashboard principal do restaurante' }] },
    { title: 'DASHBOARDS', icon: 'bar-chart-3', items: [{ label: 'Operacional', icon: 'activity', href: '/operacional', desc: 'Pedidos ativos, fila da cozinha, ocupação' }, { label: 'Financeiro', icon: 'dollar-sign', href: '/dashboard-financeiro', desc: 'Faturamento, ticket médio, metas' }, { label: 'Desempenho', icon: 'trending-up', href: '/dashboard-desempenho', desc: 'Tempo de preparo, avaliações' }] },
    { title: 'PEDIDOS', icon: 'receipt', items: [{ label: 'Novo Pedido', icon: 'plus-circle', href: '/novo-pedido', desc: 'Fluxo de abertura de comanda' }, { label: 'Pedidos Ativos', icon: 'shopping-bag', href: '/pedidos-ativos', desc: 'Pedidos em andamento por mesa' }, { label: 'Atendimento dos garçons', icon: 'concierge-bell', href: '/atendimento-garcom', desc: 'Mesas atribuídas e confirmação de pedidos' }, { label: 'Histórico de Pedidos', icon: 'history', href: '/historico-pedidos', desc: 'Pedidos finalizados com detalhes' }, { label: 'Fila da Cozinha', icon: 'chef-hat', href: '/fila-cozinha', desc: 'Pedidos aguardando preparo' }] },
    { title: 'CARDÁPIO', icon: 'book-open', items: [{ label: 'Categorias', icon: 'folder', href: '/categorias', desc: 'Entradas, principais, bebidas, etc.' }, { label: 'Produtos', icon: 'package', href: '/produtos', desc: 'Cadastro de itens com preço e foto' }, { label: 'Promoções', icon: 'tag', href: '/promocoes', desc: 'Ofertas do dia, combos, descontos' }, { label: 'Cardápio Digital', icon: 'qr-code', href: '/cardapio-digital', desc: 'Preview do QR Code do cliente' }] },
    { title: 'SALÃO', icon: 'armchair', items: [{ label: 'Mapa de Mesas', icon: 'layout-grid', href: '/mapa-mesas', desc: 'Status de cada mesa' }, { label: 'Reservas', icon: 'calendar', href: '/reservas', desc: 'Controle de reservas antecipadas' }, { label: 'Configuração de Mesas', icon: 'settings', href: '/configuracao-mesas', desc: 'Adicionar/remover mesas e QR' }] },
    { title: 'EQUIPE', icon: 'users', items: [{ label: 'Funcionários', icon: 'user-circle', href: '/funcionarios', desc: 'Garçons, cozinheiros, gerentes' }, { label: 'Escala de Trabalho', icon: 'calendar-clock', href: '/escala-trabalho', desc: 'Turnos e horários' }, { label: 'Comissões', icon: 'percent', href: '/comissoes', desc: 'Comissões por garçom' }] },
    { title: 'FINANCEIRO', icon: 'wallet', items: [{ label: 'Fechamento de Caixa', icon: 'lock', href: '/fechamento-caixa', desc: 'Encerrar expediente com relatório' }, { label: 'Fluxo de Caixa', icon: 'arrow-left-right', href: '/fluxo-caixa', desc: 'Entradas e saídas do dia' }, { label: 'Contas a Pagar/Receber', icon: 'file-text', href: '/contas-pagar-receber', desc: 'Fornecedores e contas fixas' }, { label: 'Relatórios Financeiros', icon: 'pie-chart', href: '/relatorios-financeiros', desc: 'Extrato diário, semanal, mensal' }] },
    { title: 'RELATÓRIOS', icon: 'file-bar-chart', items: [{ label: 'Vendas por Período', icon: 'bar-chart-3', href: '/vendas-por-periodo', desc: 'Análise de vendas' }, { label: 'Produtos Mais Vendidos', icon: 'star', href: '/produtos-mais-vendidos', desc: 'Top produtos' }, { label: 'Horários de Pico', icon: 'clock', href: '/horarios-de-pico', desc: 'Melhores horários' }, { label: 'Avaliações dos Clientes', icon: 'message-square', href: '/avaliacoes-clientes', desc: 'Feedback dos clientes' }, { label: 'Performance da Equipe', icon: 'award', href: '/performance-equipe', desc: 'Desempenho dos funcionários' }] }
  ];

  function buildSidebar(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    sidebarSections.forEach((section, sIdx) => {
      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'p-4' + (sIdx > 0 ? ' border-t border-border' : '');
      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `<div class="section-title"><i data-lucide="${section.icon}" class="section-icon w-3.5 h-3.5"></i><span>${section.title}</span></div><i data-lucide="chevron-down" class="w-3 h-3 text-muted"></i>`;
      sectionDiv.appendChild(header);
      const nav = document.createElement('nav');
      nav.className = 'tree-group space-y-1';
      section.items.forEach((item, iIdx) => {
        const treeItem = document.createElement('div');
        treeItem.className = 'tree-item' + (item.active ? ' active' : '');
        const link = document.createElement('a');
        link.href = item.href || '#';
        link.className = 'tree-link' + (item.active ? ' active' : '');
        link.title = item.desc;
        link.dataset.apexRota = item.href || '';
        link.innerHTML = `<i data-lucide="${item.icon}" class="w-4 h-4 flex-shrink-0"></i><span>${item.label}</span>`;
        link.addEventListener('click', (e) => {
          e.preventDefault();
          if (!item.href) {
            closeMenu();
            window.mostrarAvisoPedido?.(`${item.label}: módulo preparado para a próxima integração.`);
            return;
          }
          document.querySelectorAll('.tree-link').forEach(l => l.classList.remove('active'));
          document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
          link.classList.add('active');
          treeItem.classList.add('active');
          closeMenu();
          if (window.apexShell?.navegar) window.apexShell.navegar(item.href);
          else window.location.assign(item.href);
        });
        treeItem.appendChild(link);
        nav.appendChild(treeItem);
      });
      sectionDiv.appendChild(nav);
      container.appendChild(sectionDiv);
    });
    lucide.createIcons();
  }

  buildSidebar('sidebarContentDesktop');
  buildSidebar('sidebarContentMobile');

  const menuBtn = document.getElementById('menuBtn');
  const closeMenuBtn = document.getElementById('closeMenuBtn');
  const sidebarMobile = document.getElementById('sidebarMobile');
  const sidebarOverlay = document.getElementById('sidebarOverlay');

  function setMenuState(aberto) {
    sidebarMobile?.classList.toggle('open', aberto);
    sidebarOverlay?.classList.toggle('open', aberto);
    sidebarMobile?.setAttribute('aria-hidden', String(!aberto));
    sidebarOverlay?.setAttribute('aria-hidden', String(!aberto));
    menuBtn?.setAttribute('aria-expanded', String(aberto));
    document.body.classList.toggle('menu-mobile-aberto', aberto);
    document.body.style.overflow = aberto ? 'hidden' : '';
  }
  function openMenu() { setMenuState(true); }
  function closeMenu() { setMenuState(false); }

  if (menuBtn) menuBtn.addEventListener('click', openMenu);
  if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
  if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeMenu);
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
  window.addEventListener('resize', () => { if (window.innerWidth > 1024) closeMenu(); });

  window.apexInicializarHome = function() {
    const tabs = document.querySelectorAll('.xl\\:col-span-2 .flex.flex-wrap.items-center.gap-2.mb-6 button');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => { t.classList.remove('bg-card2'); t.classList.add('text-muted'); });
        tab.classList.add('bg-card2');
        tab.classList.remove('text-muted');
      });
    });
  };
</script>
